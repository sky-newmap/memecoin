<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>国産ミームコイン図鑑</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    header {
      background: #1e293b;
      padding: 20px;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
    }

    .sub {
      font-size: 14px;
      color: #94a3b8;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    h2 {
      margin-bottom: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
      transition: 0.2s;
      cursor: pointer;
    }

    .card:hover {
      transform: scale(1.05);
      background: #334155;
    }

    /* ✅ 正方形ロゴ */
    .logo {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: contain;   /* ← ロゴ重視（切れない） */
      background: #0f172a;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .name {
      font-size: 18px;
      font-weight: bold;
    }

    .tag {
      display: inline-block;
      margin-top: 5px;
      font-size: 12px;
      background: #475569;
      padding: 3px 7px;
      border-radius: 5px;
    }

    .danger {
      color: #f87171;
      font-size: 12px;
      margin-top: 5px;
    }

    a {
      text-decoration: none;
      color: white;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>

<body>

<header>

</header>
